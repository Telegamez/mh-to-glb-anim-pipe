# Pipeline configuration — single source of truth for paths and versions.
#
# SETUP for new operators:
#
#   cp _config/pipeline.example.yaml _config/pipeline.yaml
#
# Then fill in the placeholders below with your local UE project + UE editor +
# Blender paths. `_config/pipeline.yaml` is gitignored, so your local paths
# never leak back into the repo.

# Keyed by PIPELINE DIRECTORY, not by engine version. The stage launchers take
# the key from the folder they live in — 5.7/native-glb looks up "5.7" — so the
# key must match a pipeline tree that exists, and the engine you point it at is
# whatever you have installed. They need not be the same number: the reference
# box runs the "5.7" tree on UE 5.8.1.
#
# `engine_version` is the engine you are actually pointing at. The launchers
# read the engine's own Engine/Build/Build.version next to `editor_cmd`, print
# that, and warn if it disagrees with what you declare here — so a pipeline
# folder named after one engine and pointed at another says so in the log
# rather than quietly baking with something else.
ue_by_version:
  "5.7":
    engine_version: "<UE_VERSION_YOU_ACTUALLY_RUN>"  # e.g. 5.8.1
    project_path:   "<PATH_TO_YOUR_UPROJECT>"        # e.g. C:/Users/you/Documents/Unreal Projects/MH/MH.uproject
    editor_cmd:     "<PATH_TO_YOUR_EDITOR_CMD>"      # e.g. C:/Program Files/Epic Games/UE_5.8/Engine/Binaries/Win64/UnrealEditor-Cmd.exe
  "5.6.1":
    engine_version: ""                               # only if you also use the 5.6/cinematic pipeline
    project_path:   ""
    editor_cmd:     ""

# Legacy flat fields. Stage 05 and tools/run_fbx_reweight.ps1 read these — they
# have no per-pipeline block. Keep them in sync with the block you actually use.
ue_project_path: "<PATH_TO_YOUR_UPROJECT>"
ue_editor_cmd:   "<PATH_TO_YOUR_EDITOR_CMD>"

# Path to Blender. Used by stages 02 + 03. Checked against 4.4.1.
blender_exe:     "<PATH_TO_YOUR_BLENDER_EXE>"      # e.g. C:/Program Files/Blender Foundation/Blender 4.4/blender.exe

# Where per-character working artifacts live (relative to pipeline root,
# not the workspace root).
characters_dir:  "characters"

# GLB web constraints — enforced in stage 03.
glb_constraints:
  max_texture_px: 1024
  draco_compression: true
  target_tri_budget: 60000
  skip_groom: true          # v1: groom hair is not exported

# Stage 01 options.
stage_01:
  bake_material_inputs: false     # names only; we export textures ourselves
  export_morph_targets: false     # native-glb path uses Sequencer-baked LSE FBX instead
  export_lod: 0                   # LOD0 only for v1
  texture_format: "PNG"
